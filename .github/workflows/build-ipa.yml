name: Build unsigned IPA

# Produces an unsigned device .ipa for sideloading (AltStore / Sideloadly /
# Xcode) and publishes it as a release asset, so the file can be downloaded
# without an authenticated Actions artifact request.
#
# The project declares IPHONEOS_DEPLOYMENT_TARGET = 26.5, but every iOS 26/27
# API in the sources is already wrapped in #available with a pre-26 fallback.
# We therefore override the deployment target at build time so the resulting
# binary can run on older devices, instead of inheriting the project's 26.5.

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Xcode build configuration
        required: true
        default: Release
        type: choice
        options:
          - Release
          - Debug
      deployment_target:
        description: Minimum iOS version the IPA should support
        required: true
        default: "17.0"
        type: string
  push:
    branches: [main]
    paths:
      - .github/workflows/build-ipa.yml

permissions:
  contents: write

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    name: Build ${{ github.event.inputs.configuration || 'Release' }} IPA (iOS ${{ github.event.inputs.deployment_target || '17.0' }}+)
    # The sources use SwiftUI APIs that ship with the iOS 27 SDK
    # (ArrangementView, reorderable containers), so the Xcode 27 image is
    # required; the macOS 26 image only goes up to the iOS 26.5 SDK.
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      CONFIGURATION: ${{ github.event.inputs.configuration || 'Release' }}
      SCHEME: Pitchee
      DEPLOY_TARGET: ${{ github.event.inputs.deployment_target || '17.0' }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
          fetch-depth: 1

      - name: Select an Xcode whose iOS SDK covers the newest #available
        run: |
          set -euo pipefail
          # The SDK must be at least as new as the newest #available(iOS x)
          # in the sources, otherwise the newer SwiftUI symbols do not exist.
          needed_major=$(grep -rhoE '#available\(iOS [0-9]+' PitcheeApp \
            | grep -oE '[0-9]+$' | sort -n | tail -n 1)
          echo "Newest #available(iOS N) in sources: ${needed_major:-unknown}"
          echo "Requested minimum iOS version: $DEPLOY_TARGET"

          default_dev=$(xcode-select -p)
          default_sdk=$(xcrun --sdk iphoneos --show-sdk-version 2>/dev/null || echo 0)
          echo "Default Xcode: $default_dev (iOS SDK $default_sdk)"

          chosen="$default_dev"
          chosen_sdk="$default_sdk"
          if [ -n "$needed_major" ] && [ "${default_sdk%%.*}" -lt "$needed_major" ]; then
            chosen=''
            chosen_sdk=''
            for app in /Applications/Xcode*.app; do
              [ -d "$app" ] || continue
              sdk=$(DEVELOPER_DIR="$app/Contents/Developer" xcrun --sdk iphoneos --show-sdk-version 2>/dev/null || true)
              [ -n "$sdk" ] || continue
              if [ -z "$chosen_sdk" ] || [ "$(printf '%s\n%s\n' "$chosen_sdk" "$sdk" | sort -V | tail -n 1)" = "$sdk" ]; then
                chosen="$app/Contents/Developer"
                chosen_sdk="$sdk"
              fi
            done
          fi

          if [ -z "$chosen" ] || [ -z "$chosen_sdk" ]; then
            echo '::error::No installed Xcode provides a usable iOS SDK.'
            exit 1
          fi
          if [ -n "$needed_major" ] && [ "${chosen_sdk%%.*}" -lt "$needed_major" ]; then
            echo "::error::Best available iOS SDK is $chosen_sdk but the sources need an SDK >= $needed_major."
            exit 1
          fi
          echo "Selected $chosen with iOS SDK $chosen_sdk"
          {
            echo "DEVELOPER_DIR=$chosen"
            echo "IOS_SDK=$chosen_sdk"
          } >> "$GITHUB_ENV"

      - name: Bootstrap native dependencies
        run: sh Scripts/bootstrap-native-dependencies.sh

      - name: Build the app without code signing
        run: |
          set -euo pipefail
          # The app target inherits $(RECOMMENDED_IPHONEOS_DEPLOYMENT_TARGET),
          # which resolves to the SDK minimum outside of Xcode Cloud, so pin the
          # deployment target explicitly. It is overridden here (rather than
          # edited in the project) so the project's 26.5 default is untouched.
          args="-project Pitchee.xcodeproj -scheme $SCHEME -configuration $CONFIGURATION -sdk iphoneos"
          args="$args -destination generic/platform=iOS -derivedDataPath build/DerivedData"
          args="$args CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="
          args="$args CODE_SIGN_ENTITLEMENTS= ENABLE_BITCODE=NO"
          args="$args ARCHS=arm64 ONLY_ACTIVE_ARCH=NO"
          args="$args IPHONEOS_DEPLOYMENT_TARGET=$DEPLOY_TARGET"
          # shellcheck disable=SC2086
          if ! xcodebuild $args > build.log 2>&1; then
            echo '::error::xcodebuild failed'
            grep -E 'error:|BUILD FAILED' build.log | head -n 80
            tail -n 200 build.log
            exit 1
          fi
          tail -n 5 build.log

      - name: Package the unsigned IPA
        run: |
          set -euo pipefail
          version=$(awk -F'= ' '/^MARKETING_VERSION/ {print $2; exit}' Config/Version.xcconfig | tr -d ' ')
          app="build/DerivedData/Build/Products/${CONFIGURATION}-iphoneos/Pitchee.app"
          if [ ! -d "$app" ]; then
            echo "::error::Expected app bundle at $app"
            exit 1
          fi
          # Fail loudly if the override did not take effect: a binary built for
          # 26.5 dies with "Symbol not found ... built for iOS 26.5 which is
          # newer than running OS" on older devices.
          actual_min=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$app/Info.plist")
          echo "Packaged MinimumOSVersion: $actual_min (requested $DEPLOY_TARGET)"
          if [ "$actual_min" != "$DEPLOY_TARGET" ]; then
            echo "::error::MinimumOSVersion is $actual_min but $DEPLOY_TARGET was requested."
            exit 1
          fi
          rm -rf build/Payload dist
          mkdir -p build/Payload dist
          cp -R "$app" build/Payload/Pitchee.app
          rm -rf build/Payload/Pitchee.app/_CodeSignature
          ( cd build && zip -qry "../dist/Pitchee-${version}-${CONFIGURATION}-ios${actual_min}-unsigned.ipa" Payload )
          ls -lh dist
          {
            echo "VERSION=$version"
            echo "MIN_IOS=$actual_min"
            echo "IPA_NAME=Pitchee-${version}-${CONFIGURATION}-ios${actual_min}-unsigned.ipa"
          } >> "$GITHUB_ENV"

      - name: Publish the IPA as a release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="ipa-build-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" "dist/$IPA_NAME" \
            --title "Pitchee ${VERSION} (${CONFIGURATION}) unsigned IPA - iOS ${MIN_IOS}+" \
            --notes "Unsigned device build from commit ${GITHUB_SHA}. Minimum iOS ${MIN_IOS}. Re-sign with your own certificate before installing (AltStore, Sideloadly, or Xcode)."
          {
            echo '### Unsigned IPA'
            echo ''
            echo "- File: \`$IPA_NAME\`"
            echo "- Minimum iOS: ${MIN_IOS}"
            echo "- Download: https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag/$IPA_NAME"
            echo '- Install: re-sign with your own Apple ID (AltStore / Sideloadly) or through Xcode.'
          } >> "$GITHUB_STEP_SUMMARY"
